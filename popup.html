<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MailCraft</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #050712;
      font-family: 'DM Sans', sans-serif;
      color: #e2e8f8;
      overflow: hidden;
    }
    .orb1 {
      position: fixed; top: -60px; right: -60px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(99,102,241,0.3), transparent);
      filter: blur(40px); pointer-events: none;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.2);
      position: relative; z-index: 1;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(99,102,241,0.4);
    }
    .logo svg { width: 14px; height: 14px; }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700; color: #f0f2ff;
    }
    .brand-name span {
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .status-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 100px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: #34d399;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #34d399;
      animation: pip 2s infinite;
    }
    .body { padding: 20px 16px; position: relative; z-index: 1; }
    .how-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      color: #3d4f6e; margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .how-title::before {
      content: ''; width: 12px; height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .step {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 14px;
    }
    .step-num {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a78bfa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .step-text {
      font-size: 12px; font-weight: 300;
      color: #8896b3; line-height: 1.6;
    }
    .step-text strong { color: #a5b4fc; font-weight: 500; }
    .divider {
      height: 1px; background: rgba(255,255,255,0.04);
      margin: 16px 0;
    }
    .backend-status {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .backend-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: #3d4f6e; letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .backend-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 0.06em;
    }
    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.04);
      text-align: center;
    }
    .footer-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: #3d4f6e;
    }
    .footer-text span { color: #6366f1; }
    @keyframes pip { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div class="orb1"></div>
  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <span class="brand-name">Mail<span>Craft</span></span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      ACTIVE
    </div>
  </div>

  <div class="body">
    <div class="how-title">How to use</div>

    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Open any email in <strong>Gmail</strong></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Click the <strong>Reply</strong> button to open compose</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Select a <strong>tone</strong> from the dropdown</div>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <div class="step-text">Click <strong>✦ Give Reply</strong> — AI reply inserts automatically!</div>
    </div>

    <div class="divider"></div>

    <div class="backend-status">
      <span class="backend-label">Backend</span>
      <span class="backend-indicator" id="backendStatus">Checking…</span>
    </div>
  </div>

  <div class="footer">
    <span class="footer-text">Powered by <span>MailCraft AI</span></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
